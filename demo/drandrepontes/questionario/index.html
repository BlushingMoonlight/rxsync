<!doctype html>
<html lang="pt-BR" data-estilo="clean-claro" data-voltar="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4f1ea">
<title>Questionário · Clínica Evoluir</title>
<link rel="stylesheet" href="../comum/ds.css">
<link rel="stylesheet" href="questionario.css">
<script src="../comum/comum.js"></script>
</head>
<body>
<main class="questionario">
  <header class="topo-q">
    <div id="logo"></div>
    <h1>Questionário da clínica</h1>
    <p class="mudo">Para ajustarmos o sistema à rotina da Clínica Evoluir. Responda no seu tempo: as respostas ficam salvas neste aparelho enquanto você escreve. Quando terminar, toque em "Enviar respostas".</p>
  </header>
  <section class="progresso-q" aria-live="polite"><div class="barra"><i id="barra"></i></div><span id="contagem"></span><span id="enviado" class="fraco"></span></section>
  <form id="perguntas"></form>
  <div class="enviar-q"><button class="botao" type="button" id="enviar">Enviar respostas</button><p class="fraco">Você pode enviar de novo depois: cada envio fica guardado como uma versão nova.</p></div>
</main>
<script src="questionario.js"></script>
</body>
</html>
