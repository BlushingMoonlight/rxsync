<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Ambiente de Teste | Inteligência Artificial</title>
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: { 900: '#0f172a' },
                        emerald: { 500: '#10b981', 600: '#059669' }
                    }
                }
            }
        }
    </script>
</head>

<!-- O h-[100dvh] garante que a tela ocupe exatamente a altura visível em celulares e PCs -->
<body class="font-sans text-slate-800 bg-slate-100 flex flex-col h-[100dvh] overflow-hidden">

    <!-- Cabeçalho Fixo -->
    <header class="w-full bg-white border-b border-slate-200 shrink-0 z-10 px-4 h-16 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-primary-900 rounded-lg flex items-center justify-center">
                <i data-lucide="bot" class="w-5 h-5 text-emerald-500"></i>
            </div>
            <span class="font-bold text-lg text-primary-900">RXSync</span>
        </div>
        <span class="px-2 py-1 bg-amber-100 text-amber-800 text-[10px] sm:text-xs font-bold uppercase tracking-wide rounded">
            Ambiente de Teste
        </span>
    </header>

    <!-- Área Principal -->
    <main class="flex-1 w-full max-w-4xl mx-auto flex flex-col p-2 sm:p-6 h-full">
        
        <!-- Container do Chat -->
        <div class="flex-1 w-full bg-white sm:rounded-xl shadow-lg border border-slate-200 flex flex-col overflow-hidden">
            
            <!-- Aviso rápido -->
            <div class="bg-slate-50 px-4 py-3 border-b border-slate-200 flex items-center gap-2 shrink-0">
                <i data-lucide="info" class="w-4 h-4 text-slate-500"></i>
                <span class="text-sm text-slate-600 font-medium">Envie uma mensagem abaixo para iniciar o teste.</span>
            </div>

            <!-- IFRAME DO CHATWOOT -->
            <!-- Importante: O flex-1 w-full h-full garante que ele não vai bugar e vai preencher a tela -->
            <iframe 
                src="https://app.rxsync.com.br/widget?website_token=COLOQUE_O_TOKEN_AQUI" 
                class="flex-1 w-full h-full border-0"
                allow="camera; microphone; fullscreen; display-capture; picture-in-picture; clipboard-write;"
            ></iframe>
            
        </div>
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
