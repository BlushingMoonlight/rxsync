<style>/* =====================================================================================================
   Âncora: as cores e os tamanhos de todas as telas da RXSync, num arquivo só (rxsync-sistema DEC-156, P12).
   Quem usa: o painel da clínica (painel/, montado por scripts/painel_montar.mjs) e a Central (central/, montada por
   scripts/central_montar.mjs). Os dois montadores põem este arquivo no começo do <style> da página.
   A Central só acrescenta, logo depois, os nomes próprios dela apontando para estes (entrega 5 do plano do novo front).
   Regras: branco predominante; a marca só no botão principal, no link, no foco e no item selecionado; o verde só para
   "deu certo"; estado sempre com cor, ícone e palavra. O escuro só vale quando a pessoa escolhe (data-tema="escuro").
   Contraste conferido na WCAG e no APCA (tabela no rxsync-sistema, docs/mapa/painel-novo.md, seção 11).
   ===================================================================================================== */
@font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap; src: url('/assets/fontes/inter-400.woff2') format('woff2'); }
@font-face { font-family: 'Inter'; font-style: normal; font-weight: 500; font-display: swap; src: url('/assets/fontes/inter-500.woff2') format('woff2'); }
@font-face { font-family: 'Inter'; font-style: normal; font-weight: 600; font-display: swap; src: url('/assets/fontes/inter-600.woff2') format('woff2'); }
:root {
  /* cores do modo claro (o padrão) */

  --texto: #15191C; --texto-2: #4A545A;

  --perigo-texto: #962318; --perigo-fundo: #FCEDEB; --perigo-forte: #B42318; --perigo-botao-texto: #FFFFFF;
  --toggle-off: #6B767C; --desativado: #8A9499;
  --foco: #0A5148;
  --sombra-menu: 0 2px 8px rgba(21, 25, 28, .10); --sombra-janela: 0 12px 32px rgba(21, 25, 28, .18);

/* cores do modo escuro: só quando a pessoa escolhe (nunca pelo aparelho sozinho) */
:root[data-tema="escuro"] {
  --fundo: #0E1214; --superficie: #161B1E; --superficie-2: #0E1214;

  --borda-campo: #9AA4A9; --borda: #2A3135;
  --primaria: #A8DDD9; --primaria-forte: #C9ECE9; --primaria-suave: #173A36; --botao-texto: #0E1214;
  --ok-texto: #A3E8BE; --ok-fundo: #12291D;
  --atencao-texto: #F7D48E; --atencao-fundo: #2E2410;
  --perigo-texto: #FAC2BB; --perigo-fundo: #33181A; --perigo-forte: #FAC2BB; --perigo-botao-texto: #0E1214;
  --toggle-off: #9AA4A9; --desativado: #8A9499;

/* =====================================================================================================
   Central RXSync · Âncora (DEC-068; visual claro desde a entrega 5 do novo front, rxsync-sistema DEC-156 e P12).
   As cores, as letras e os tamanhos vêm do assets/ancora/tokens.css, que o central_montar.mjs põe antes deste arquivo
   (o mesmo do painel da clínica). Aqui ficam só os nomes próprios da Central, apontando para os do Âncora. Regras da P12:
   branco predominante, menu lateral, trilho e barra de baixo claros, a marca só no botão principal, no link, no foco e no
   item selecionado, cartão sem sombra, Inter com pesos até 600, nada abaixo de 12 px; o escuro só quando o Jean escolhe.
   ===================================================================================================== */
:root {
  --superficie-3: #EEF1F1; --texto-3: var(--texto-2); --borda-forte: var(--borda-campo); --primaria-texto: var(--primaria);
  --atencao-forte: var(--atencao-texto); --info-fundo: var(--superficie-2); --info-texto: var(--texto); --info-forte: var(--texto-2);
  --nav-fundo: var(--superficie-2); --nav-texto: var(--texto-2); --nav-ativo: var(--texto); --nav-ativo-fundo: var(--primaria-suave); --nav-grupo: var(--texto-2);
  --rapida-fundo: var(--texto); --rapida-acao: #A8DDD9;
  --t-11: 12px; --t-12: 12px; --t-13: 13px; --t-14: 14px; --t-16: 16px; --t-18: 18px; --t-20: 20px; --t-24: 24px; --t-30: 28px;
  --r-1: var(--r-marcar); --r-2: var(--r-botao); --r-3: var(--r-cartao); --r-4: var(--r-janela); --r-cheio: var(--r-capsula);
  --topo-h: 56px; --lateral: 256px; --lateral-recolhida: 76px; --trilho: 88px;
}
:root[data-tema="escuro"] { --superficie-3: #1F262A; --rapida-fundo: var(--superficie); --rapida-acao: var(--primaria); }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea { font-size: 16px; } /* 16 px: o iPad não dá zoom ao tocar no campo */
a { color: var(--primaria-texto); }
:focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.mudo { color: var(--texto-3); } .peq { font-size: var(--t-13); } .forte { font-weight: 600; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* Todo ícone tem tamanho fixo (sem isso, um <svg> sem tamanho ocupa a largura toda). */
svg.icone { width: 20px; height: 20px; flex: none; display: block; }
svg.icone.p { width: 16px; height: 16px; } svg.icone.g { width: 24px; height: 24px; }

.casca > .coluna { min-width: 0; }
.lateral, .trilho { display: none; }
.topo { position: sticky; top: 0; z-index: 30; min-height: calc(var(--topo-h) + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) calc(env(safe-area-inset-right, 0px) + var(--e-3)) 0 calc(env(safe-area-inset-left, 0px) + var(--e-3));
  display: flex; align-items: center; gap: var(--e-2); background: var(--fundo); border-bottom: 1px solid var(--borda); }
.topo .titulo { font-weight: 600; font-size: var(--t-18); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topo .migalhas { display: none; }
.btn-ic { width: var(--alvo); height: var(--alvo); display: grid; place-items: center; border-radius: var(--r-2); border: 0; background: none; color: var(--texto-2); cursor: pointer; flex: none; position: relative; }
.btn-ic:hover { background: var(--superficie-3); }
/* o ícone do logo (assets/icones/), no alto do menu, do trilho e da entrada */
.marca { width: 32px; height: 32px; border-radius: var(--r-botao); display: block; flex: none; }
.busca-campo { display: none; }
.barra { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--superficie); border-top: 1px solid var(--borda);
  padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.barra button { height: var(--barra-h); border: 0; background: none; color: var(--texto-3); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: var(--t-12); font-weight: 600; cursor: pointer; position: relative; min-width: 0; }
.barra button[aria-current="page"] { color: var(--primaria-texto); }
.barra .pilula { width: 56px; height: 30px; border-radius: var(--r-cheio); display: grid; place-items: center; }
.barra button[aria-current="page"] .pilula { background: var(--primaria-suave); }
.contador { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--perigo-forte); color: var(--perigo-botao-texto); font-size: 12px; font-weight: 600; display: grid; place-items: center; }
.barra .contador { position: absolute; top: 7px; left: calc(50% + 8px); }
body.teclado .barra { display: none; }
.conteudo { padding: var(--e-4) calc(env(safe-area-inset-right, 0px) + var(--e-4)) calc(var(--barra-h) + var(--e-8) + env(safe-area-inset-bottom, 0px)) calc(env(safe-area-inset-left, 0px) + var(--e-4)); max-width: 1180px; width: 100%; margin: 0 auto; }
.conteudo:focus { outline: none; }

  .trilho { display: flex; flex-direction: column; align-items: center; gap: var(--e-1); position: sticky; top: 0; height: 100vh; padding: calc(env(safe-area-inset-top, 0px) + var(--e-3)) 0 var(--e-4); background: var(--nav-fundo); border-right: 1px solid var(--borda); }
  .trilho .marca { margin-bottom: var(--e-4); }
  .trilho button { width: 72px; min-height: 60px; border: 0; background: none; color: var(--nav-texto); border-radius: var(--r-3); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: var(--t-11); font-weight: 600; cursor: pointer; position: relative; }
  .trilho button[aria-current="page"] { color: var(--nav-ativo); background: var(--nav-ativo-fundo); }
  .trilho button:hover { background: var(--superficie-3); }

  .trilho .espaco { flex: 1; }
  .barra { display: none; }
  .conteudo { padding: var(--e-6) var(--e-6) var(--e-10); }
  .topo { padding: 0 var(--e-6); }
  .topo .titulo, .topo .marca-topo { display: none; }
  .topo .migalhas { display: flex; flex: 1; min-width: 0; }
  .busca-campo { display: flex; align-items: center; gap: var(--e-2); width: min(360px, 40vw); height: var(--alvo); padding: 0 var(--e-3); border-radius: var(--r-2); border: 1px solid var(--borda-forte); background: var(--superficie); color: var(--texto-3); cursor: pointer; font-size: var(--t-14); }
  .busca-campo kbd { margin-left: auto; font: 500 12px/1 var(--fonte); border: 1px solid var(--borda-forte); border-radius: 5px; padding: 3px 6px; color: var(--texto-3); }

}
@media (min-width: 1024px) {
  .casca { grid-template-columns: var(--lateral) minmax(0, 1fr); }
  .casca.recolhida { grid-template-columns: var(--lateral-recolhida) minmax(0, 1fr); }
  .trilho { display: none; }
  .lateral { display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; background: var(--nav-fundo); color: var(--nav-texto); border-right: 1px solid var(--borda); padding: calc(env(safe-area-inset-top, 0px) + var(--e-4)) var(--e-3) var(--e-4); overflow-y: auto; }
  .lateral .cab { display: flex; align-items: center; gap: var(--e-3); padding: var(--e-1) var(--e-1) var(--e-4) var(--e-2); color: var(--texto); font-weight: 600; }
  .lateral .cab .nome { flex: 1; min-width: 0; } .lateral .cab small { display: block; color: var(--nav-texto); font-weight: 500; font-size: var(--t-12); }
  .lateral .cab .btn-ic { color: var(--nav-texto); } .lateral .cab .btn-ic:hover { background: var(--superficie-3); }
  .lateral .grupo-nav { font-size: var(--t-12); font-weight: 500; color: var(--nav-grupo); padding: var(--e-4) var(--e-3) var(--e-2); }
  .lateral button.item-nav { position: relative; width: 100%; display: flex; align-items: center; gap: var(--e-3); min-height: var(--alvo); padding: 0 var(--e-3); border: 0; border-radius: var(--r-2); background: none; color: var(--nav-texto); font-size: var(--t-14); font-weight: 600; text-align: left; cursor: pointer; }

  .casca.recolhida .lateral .rotulo, .casca.recolhida .lateral .grupo-nav, .casca.recolhida .lateral .cab .nome, .casca.recolhida .lateral .contador, .casca.recolhida .lateral .cab .marca { display: none; }
  .casca.recolhida .lateral button.item-nav { justify-content: center; padding: 0; }
  .casca.recolhida .lateral .cab { justify-content: center; padding-left: 0; padding-right: 0; }

/* ---------- caminho (migalhas) ---------- */
.migalhas ol { list-style: none; margin: 0; padding: 0; display: flex; align-items: center; gap: 2px; min-width: 0; font-size: var(--t-14); color: var(--texto-3); }
.migalhas li { display: flex; align-items: center; gap: 2px; white-space: nowrap; min-width: 0; }
.migalhas li:last-child { color: var(--texto); font-weight: 600; overflow: hidden; } .migalhas li:last-child span { overflow: hidden; text-overflow: ellipsis; }
.migalhas a { color: inherit; text-decoration: none; display: inline-flex; align-items: center; min-height: var(--alvo); padding: 0 4px; border-radius: var(--r-marcar); }
.migalhas li:not(:last-child) { flex: 0 1 auto; overflow: hidden; } .migalhas li:first-child { flex-shrink: 0; } .migalhas li:not(:last-child) a { display: block; line-height: var(--alvo); max-width: 16em; overflow: hidden; text-overflow: ellipsis; }

.cartao { background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--r-3); min-width: 0; }

.pilha { display: grid; gap: var(--e-4); grid-template-columns: minmax(0, 1fr); }

.etq.ok { background: var(--ok-fundo); color: var(--ok-texto); } .etq.atencao { background: var(--atencao-fundo); color: var(--atencao-texto); }

function textoParado(p) { return `o workflow ${p.workflow} (${p.nome || P_MOTOR[p.workflow][0]}) ${p.desde ? 'não roda desde ' + fmtHora(p.desde) : 'ainda não rodou'}`; }
function avisoMotor(m) {
  if (!m || !m.segurado) return null;

    el('div', {}, el('b', { text: 'Disparo parado: ' }), (m.parados || []).map(textoParado).join(' e ') + '. Nada sai até ele voltar a rodar.'));
}
function cartaoMotor(m) {

}

async function confirmarProposta(p, nivelPedido) {
  const nivel = nivelPedido || Number(p.nivel) || 2;
  const v = await pedirAcao('proposta_confirmar', { proposta_id: String(p.id) }, { nivel, titulo: p.resumo || 'Confirmar a proposta', linhas: linhasProposta(p), nome: p.nome_nivel3,
    rotuloNome: p.acao === 'ligar_chave' || /^prosp_/.test(p.acao) ? 'o nome' : 'o nome da clínica',
    texto: 'Proposta do assistente. Roda como o botão da tela, com o mesmo nível, e fica no registro com "via assistente".' });
  if (!v) return;
  const r = await chamar('proposta_confirmar', v);
  if (!r.ok && r.nivel > nivel && !nivelPedido) return confirmarProposta(p, r.nivel);
  if (!r.ok) {
    if (/vencida/.test(r.mensagem || '')) p.estado = 'vencida'; else if (/descartada/.test(r.mensagem || '')) p.estado = 'descartada'; else if (/confirmada/.test(r.mensagem || '')) p.estado = 'confirmada';
    desenharFalas(); rapida(r.mensagem || 'Não consegui.'); return;
  }
  p.estado = 'confirmada'; p.registro = r.pode_desfazer && r.registro_id ? r.registro_id : null;
  desenharFalas();
  if (p.acao === 'ligar_chave') await carregarConfig();
  est.clientes = null; await rotear();
  rapida(r.aviso_email || r.mensagem || 'Feito.', p.registro ? () => desfazer(p.registro) : null);
}
async function descartarProposta(p) {
  const r = await chamar('proposta_descartar', { proposta_id: String(p.id) });
  if (r.ok || /já foi/.test(r.mensagem || '')) p.estado = r.ok ? 'descartada' : /vencida/.test(r.mensagem) ? 'vencida' : p.estado;
  desenharFalas();
  rapida(r.ok ? 'Proposta descartada.' : (r.mensagem || 'Não consegui.'));
}

        el('div', { class: 'cartao kpi ia-mensagens' }, el('div', { class: 'rot', text: 'Mensagens do atendimento no mês' }), el('div', { class: 'val num', text: fmtNum(ci.mensagens_atendimento_mes) }),
          el('div', { class: 'var', text: 'todas as clínicas; fora do custo acima' }))),
      el('div', { class: 'aviso info mt' }, icone('info'), el('div', { text: ci.aviso || 'O atendimento das clínicas não entra: o banco só conta as mensagens, não os tokens.' })),
      ci.preco_preenchido ? null : el('div', { class: 'aviso atencao mt' }, icone('alerta'), el('div', {}, 'Preencha o preço por mil tokens (entrada e saída) em Prospecção › Custos para ver o custo em reais.',
        ligada('tela_prospeccao') ? [' ', el('a', { href: '#prospeccao/custos', text: 'Abrir Custos' })] : null)))),

};
