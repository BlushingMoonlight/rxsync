      linhas.map(([r, a, d]) => el('tr', {}, el('th', { text: r }), el('td', { text: a === '' || a == null ? '(vazio)' : a }), el('td', { text: d === '' || d == null ? '(vazio)' : d }))));
    let fechar;
    const enviar = e => { e.preventDefault(); if (inp.value.trim().toUpperCase() !== 'CONFIRMAR') { inp.focus(); return; } fechar(); ok(true); };
    fechar = janela(el('form', { onsubmit: enviar }, el('h2', { text: titulo }), linhas.length ? tab : null, aviso ? el('p', { class: 'mudo', text: aviso }) : null,
      el('label', { class: 'campo' }, 'Para confirmar, digite CONFIRMAR', inp),
      el('div', { class: 'acoes' }, el('button', { class: 'btn pri', type: 'submit', text: 'Confirmar' }), el('button', { class: 'btn sec', type: 'button', text: 'Cancelar', onclick: () => { fechar(); ok(false); } }))));
  });
}
function mostrarSegredo(titulo, valor, texto) {
  const fechar = janela(el('div', {}, el('h2', { text: titulo }), el('p', { class: 'mudo', text: texto }), el('div', { class: 'chave-totp', text: valor }),
    el('div', { class: 'acoes' }, el('button', { class: 'btn pri', type: 'button', text: 'Copiar', onclick: () => copiar(valor) }), el('button', { class: 'btn sec', type: 'button', text: 'Já copiei', onclick: () => fechar() }))));
}

// ---------------------------------------------------------------- entrada
function base32(bytes) { const A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567'; let bits = 0, v = 0, s = ''; for (const b of bytes) { v = (v << 8) | b; bits += 8; while (bits >= 5) { s += A[(v >>> (bits - 5)) & 31]; bits -= 5; } } if (bits) s += A[(v << (5 - bits)) & 31]; return s; }
function telaEntrada(...filhos) { $('app').hidden = true; $('entrada').hidden = false; $('entrada-corpo').replaceChildren(...filhos); const i = $('entrada-corpo').querySelector('input'); if (i) i.focus(); }
const msgErro = () => el('p', { class: 'erro', role: 'alert' });
async function entrada(mensagem) {
  const r = await chamar('estado');
  if (r.ok && r.primeiro_acesso) return primeiroAcesso();
  formEntrada(mensagem || (r.ok ? '' : r.mensagem));
}
function formEntrada(mensagem, comRecuperacao) {
  const usuario = el('input', { type: 'text', autocomplete: 'username', value: 'Central RXSync', readonly: true, hidden: true });
  const senha = el('input', { type: 'password', autocomplete: 'current-password', required: true, enterkeyhint: 'next' });
  const codigo = comRecuperacao
    ? el('input', { type: 'text', autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false', placeholder: 'XXXX-XXXX', required: true })
    : el('input', { class: 'codigo', type: 'text', inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: '6', pattern: '[0-9]*', required: true, enterkeyhint: 'go' });
  const erro = msgErro(); erro.textContent = mensagem || '';
  const btn = el('button', { class: 'btn pri plena', type: 'submit', text: 'Entrar' });
  const enviar = async e => {
    e.preventDefault(); btn.disabled = true; erro.textContent = '';
    const dados = comRecuperacao ? { senha: senha.value, recuperacao: codigo.value.trim().toUpperCase() } : { senha: senha.value, codigo: codigo.value.replace(/\D/g, '') };
    const r = await chamar('entrar', dados); btn.disabled = false;
    if (r.ok && r.sessao) { guardarSessao(r.sessao); if (r.recuperacao_restam != null) toast(`Restam ${r.recuperacao_restam} códigos de recuperação.`); return abrirApp(); }
    if (r.primeiro_acesso) return primeiroAcesso();
    erro.textContent = r.mensagem || 'Não consegui entrar.'; codigo.value = ''; codigo.focus();
  };
  telaEntrada(el('form', { onsubmit: enviar }, usuario,
    el('label', { class: 'campo' }, 'Senha', senha),
    el('label', { class: 'campo' }, comRecuperacao ? 'Código de recuperação' : 'Código do app Senhas (6 dígitos)', codigo),
    erro, btn,
    el('div', { class: 'acoes' }, el('button', { class: 'btn sec plena', type: 'button', text: comRecuperacao ? 'Usar o código do app Senhas' : 'Usar um código de recuperação', onclick: () => formEntrada('', !comRecuperacao) }))));
}
function primeiroAcesso() {
  const erro = msgErro();
  const btn = el('button', { class: 'btn pri plena', type: 'button', text: 'Mandar código pelo Telegram' });
  btn.onclick = async () => { btn.disabled = true; const r = await chamar('primeiro_pedir'); btn.disabled = false; if (r.ok) primeiroSenha(r.mensagem); else erro.textContent = r.mensagem || 'Não consegui.'; };
  telaEntrada(el('h2', { text: 'Primeiro acesso' }),
    el('p', { class: 'mudo', text: 'A Central ainda não tem senha. Um código de 8 dígitos vai para o seu Telegram (vale 10 minutos).' }), erro, btn,
    el('div', { class: 'acoes' }, el('button', { class: 'btn sec plena', type: 'button', text: 'Já tenho o código', onclick: () => primeiroSenha('') })));
}
function primeiroSenha(aviso) {
  const usuario = el('input', { type: 'text', autocomplete: 'username', value: 'Central RXSync', readonly: true, hidden: true });
  const codigo = el('input', { class: 'codigo', inputmode: 'numeric', autocomplete: 'off', maxlength: '8', required: true });
  const s1 = el('input', { type: 'password', autocomplete: 'new-password', minlength: '12', required: true });
  const s2 = el('input', { type: 'password', autocomplete: 'new-password', minlength: '12', required: true });
  const erro = msgErro(); const btn = el('button', { class: 'btn pri plena', type: 'submit', text: 'Criar a senha' });
  const enviar = async e => {
    e.preventDefault(); erro.textContent = '';
    if (s1.value !== s2.value) { erro.textContent = 'As duas senhas não são iguais.'; return; }
    if (s1.value.length < 12) { erro.textContent = 'Use pelo menos 12 caracteres.'; return; }
    btn.disabled = true; const r = await chamar('primeiro_senha', { codigo: codigo.value.replace(/\D/g, ''), senha: s1.value }); btn.disabled = false;
    if (r.ok && r.desafio) return primeiroAutenticador(r.desafio);
    erro.textContent = r.mensagem || 'Não consegui.';
  };
  telaEntrada(el('form', { onsubmit: enviar }, usuario, el('h2', { text: 'Primeiro acesso: senha' }), aviso ? el('p', { class: 'mudo', text: aviso }) : null,
    el('label', { class: 'campo' }, 'Código do Telegram (8 dígitos)', codigo),
    el('label', { class: 'campo' }, 'Senha nova (12 caracteres ou mais; deixe o app Senhas sugerir)', s1),
    el('label', { class: 'campo' }, 'Repita a senha', s2), erro, btn));
}
function primeiroAutenticador(desafio) {
  // A chave do autenticador é sorteada AQUI, no iPad (crypto.getRandomValues). Ela não vai para o banco: você a guarda no
  // app Senhas e cola a mesma chave na credencial "TOTP Central" do n8n (DEC-054).
  const chave = base32(crypto.getRandomValues(new Uint8Array(20)));
  const link = 'otpauth://totp/RXSync:Central?secret=' + chave + '&issuer=RXSync&algorithm=SHA1&digits=6&period=30';
  const codigo = el('input', { class: 'codigo', inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: '6', required: true });
  const erro = msgErro(); const btn = el('button', { class: 'btn pri plena', type: 'submit', text: 'Confirmar o código' });
  const enviar = async e => {
    e.preventDefault(); btn.disabled = true; erro.textContent = '';
    const r = await chamar('primeiro_confirmar', { desafio, codigo: codigo.value.replace(/\D/g, '') }); btn.disabled = false;
    if (r.ok && r.sessao) { guardarSessao(r.sessao); return mostrarRecuperacao(r.recuperacao || []); }
    if (r.recomecar) return primeiroAcesso();
    erro.textContent = r.mensagem || 'Não consegui.'; codigo.value = '';
  };
  telaEntrada(el('form', { onsubmit: enviar }, el('h2', { text: 'Primeiro acesso: código de 6 dígitos' }),
    el('ol', { class: 'passos' },
      el('li', {}, 'Toque em ', el('a', { href: link, text: 'adicionar ao app Senhas' }), '. Se não abrir: app Senhas › Códigos › + › "Inserir chave de configuração" e cole a chave abaixo.'),
      el('li', { text: 'No n8n: Credentials › "TOTP Central" › Secret: cole a mesma chave (troque a provisória) e salve.' }),
      el('li', { text: 'Digite o código de 6 dígitos que o app Senhas mostra.' })),
    el('div', { class: 'chave-totp', text: chave }),
    el('div', { class: 'acoes' }, el('button', { class: 'btn sec plena', type: 'button', text: 'Copiar a chave', onclick: () => copiar(chave) })),
    el('label', { class: 'campo mt' }, 'Código do app Senhas', codigo), erro, btn,
    el('p', { class: 'mudo peq', text: 'Este passo vale 30 minutos. A chave só aparece aqui, agora.' })));
}
function mostrarRecuperacao(codigos) {
  const texto = codigos.join('\n');
  const ok = el('input', { type: 'checkbox' });
  const btn = el('button', { class: 'btn pri plena', type: 'button', text: 'Entrar na Central', disabled: true, onclick: () => abrirApp() });
  ok.onchange = () => { btn.disabled = !ok.checked; };
  telaEntrada(el('h2', { text: 'Códigos de recuperação' }),
    el('p', { class: 'mudo', text: 'Guarde estes 10 códigos (por exemplo, numa nota do app Senhas). Cada um entra uma vez, no lugar do código de 6 dígitos. Eles não aparecem de novo.' }),
    el('div', { class: 'codigos' }, codigos.map(c => el('span', { text: c }))),
    el('div', { class: 'acoes' }, el('button', { class: 'btn sec plena', type: 'button', text: 'Copiar os 10 códigos', onclick: () => copiar(texto) })),
    el('label', { class: 'campo linha mt' }, ok, 'Guardei os códigos'), btn);
}

// ---------------------------------------------------------------- navegação
const MENU = [
  ['inicio', 'Início', 1], ['clientes', 'Clientes', 1], ['dinheiro', 'Dinheiro', 1], ['sistema', 'Sistema', 1],
  ['uso', 'Uso e limites'], ['avisos', 'Avisos'], ['funil', 'Funil'], ['seguranca', 'Segurança'], ['chaves', 'Chaves'], ['agregados', 'Agregados de pacientes'], ['mais', 'Mais', 1]
];
const TELAS = {};
function montarMenu() {
  const rail = $('rail-nav'), tab = $('tabbar'); rail.replaceChildren(); tab.replaceChildren();
  for (const [id, nome, naAba] of MENU) {
    if (id === 'agregados' && est.chaves.tela_agregados_pacientes !== 'SIM') continue;
    if (id !== 'mais') rail.append(el('button', { type: 'button', 'data-tela': id, onclick: () => ir(id) }, icone(id), nome));
    if (naAba) tab.append(el('button', { type: 'button', 'data-tela': id, onclick: () => ir(id) }, icone(id), nome));
  }
  rail.append(el('div', { class: 'sep' }), el('button', { type: 'button', onclick: sair }, 'Sair'));
}
function ir(rota) { if (location.hash === '#' + rota) rotear(); else location.hash = rota; }
async function rotear() {
  if (!est.sessao) return;
  const [nome, ...resto] = (location.hash || '#inicio').slice(1).split('/');
  const t = TELAS[nome] ? nome : 'inicio';
  const titulo = (MENU.find(m => m[0] === t) || [t, 'Central RXSync'])[1];
  $('topo-titulo').textContent = titulo; document.title = titulo + ' · Central RXSync';
  for (const b of document.querySelectorAll('[data-tela]')) b.toggleAttribute('aria-current', b.dataset.tela === t || (b.dataset.tela === 'mais' && !['inicio', 'clientes', 'dinheiro', 'sistema'].includes(t)));
  for (const b of document.querySelectorAll('[aria-current]')) b.setAttribute('aria-current', 'page');
  const c = $('conteudo'); c.replaceChildren(el('p', { class: 'mudo', text: 'Carregando…' }));
  try { await TELAS[t](c, resto.map(decodeURIComponent)); } catch (e) { c.replaceChildren(el('div', { class: 'faixa alerta', text: 'Algo deu errado nesta tela. Toque em Atualizar.' })); }
  c.focus({ preventScroll: true }); window.scrollTo(0, 0);
}
// Tela desligada ou com erro: mostra o motivo e para.
function falhou(c, r) {
  if (r.desligada) { c.replaceChildren(el('h1', { text: 'Tela desligada' }), el('div', { class: 'bloco' }, el('p', { text: 'Esta tela ainda está desligada (chave ' + (r.chave || '') + ').' }), el('button', { class: 'btn sec', type: 'button', text: 'Ver as chaves', onclick: () => ir('chaves') }))); return true; }
  if (!r.ok) { c.replaceChildren(el('div', { class: 'faixa alerta', text: r.mensagem || 'Não consegui carregar.' })); return true; }
  return false;
}
async function abrirApp() {
  const r = await chamar('config');
  if (!r.ok) return entrada(r.mensagem);
  est.config = r; est.chaves = Object.fromEntries((r.chaves || []).map(k => [k.chave, k.valor]));
  $('entrada').hidden = true; $('app').hidden = false; montarMenu(); rotear();
}
async function sair() { await chamar('sair'); guardarSessao(''); entrada('Você saiu.'); }
window.addEventListener('hashchange', rotear);
$('btn-atualizar').onclick = () => rotear();
// Ao voltar para a Central (iPad acordou ou trocou de app), confere se a sessão ainda vale.
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && est.sessao && !$('app').hidden) chamar('config').then(r => { if (r.ok) est.chaves = Object.fromEntries((r.chaves || []).map(k => [k.chave, k.valor])); }); });

// ---------------------------------------------------------------- telas
/* TELAS */

// ---------------------------------------------------------------- começo
if (est.sessao) abrirApp(); else entrada();
})();
