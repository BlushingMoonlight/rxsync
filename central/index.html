<style>/* =====================================================================================================
   Âncora: as cores e os tamanhos de todas as telas da RXSync, num arquivo só (rxsync-sistema DEC-156, P12).
   Quem usa: o painel da clínica (painel/, montado por scripts/painel_montar.mjs) e a Central (central/, montada por
   scripts/central_montar.mjs). Os dois montadores põem este arquivo no começo do <style> da página.
   A Central só acrescenta, logo depois, os nomes próprios dela apontando para estes (entrega 5 do plano do novo front).
   Regras: branco predominante; a marca só no botão principal, no link, no foco e no item selecionado; o verde só para
   "deu certo"; estado sempre com cor, ícone e palavra. O escuro só vale quando a pessoa escolhe (data-tema="escuro").
   Contraste conferido na WCAG e no APCA (tabela no rxsync-sistema, docs/mapa/painel-novo.md, seção 11).
   ===================================================================================================== */
@font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap; src: url('/assets/fontes/inter-400.woff2') format('woff2'); }

:root {

  --ok-texto: #17653F; --ok-fundo: #EAF5EE;
  --atencao-texto: #7A4A00; --atencao-fundo: #FDF4E3;
  --perigo-texto: #962318; --perigo-fundo: #FCEDEB; --perigo-forte: #B42318; --perigo-botao-texto: #FFFFFF;

/* A entrada do painel e da Central (rxsync-sistema DEC-203): o mesmo layout nas duas, montado junto com o estilo de cada

#entrada .msg, #entrada p.erro { margin: 0; font-size: var(--t-2); line-height: var(--l-2); color: var(--texto-2); }

/* =====================================================================================================

   As cores, as letras e os tamanhos vêm do assets/ancora/tokens.css, que o central_montar.mjs põe antes deste arquivo
   (o mesmo do painel da clínica). Aqui ficam só os nomes próprios da Central, apontando para os do Âncora. Regras da P12:
   branco predominante, menu lateral, trilho e barra de baixo claros, a marca só no botão principal, no link, no foco e no
   item selecionado, cartão sem sombra, Inter com pesos até 600, nada abaixo de 12 px; o escuro só quando o Jean escolhe.
   ===================================================================================================== */
:root {
  --superficie-3: #EEF1F1; --texto-3: var(--texto-2); --borda-forte: var(--borda-campo); --primaria-texto: var(--primaria);
  --atencao-forte: var(--atencao-texto); --info-fundo: var(--superficie-2); --info-texto: var(--texto); --info-forte: var(--texto-2);

  --rapida-fundo: var(--texto); --rapida-acao: #A8DDD9;

  --r-1: var(--r-marcar); --r-2: var(--r-botao); --r-3: var(--r-cartao); --r-4: var(--r-janela); --r-cheio: var(--r-capsula);
  --topo-h: 56px; --lateral: 256px; --lateral-recolhida: 76px; --trilho: 96px;
}
:root[data-tema="escuro"] { --superficie-3: #1F262A; --rapida-fundo: var(--superficie); --rapida-acao: var(--primaria); }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--fundo); color: var(--texto); font: 400 var(--t-16)/1.5 var(--fonte); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea { font-size: 16px; } /* 16 px: o iPad não dá zoom ao tocar no campo */
a { color: var(--primaria-texto); }
:focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.mudo { color: var(--texto-3); } .peq { font-size: var(--t-13); } .forte { font-weight: 600; }

.marca { width: 32px; height: 32px; border-radius: var(--r-botao); display: block; flex: none; }
.busca-campo { display: none; }
.barra { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--superficie); border-top: 1px solid var(--borda);
  padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.barra button { height: var(--barra-h); border: 0; background: none; color: var(--texto-3); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: var(--t-12); font-weight: 600; cursor: pointer; position: relative; min-width: 0; }

/* ---------- tipografia e blocos ---------- */
.cabecalho { display: flex; align-items: flex-end; gap: var(--e-3) var(--e-4); flex-wrap: wrap; margin-bottom: var(--e-5); }
.cabecalho .texto { flex: 1 1 240px; min-width: 0; }
.sobretitulo { font-size: var(--t-13); font-weight: 600; color: var(--texto-3); margin: 0 0 2px; }
h1 { font-size: var(--t-24); line-height: var(--l-titulo); font-weight: 600; margin: 0; text-wrap: balance; }

h2 { font-size: var(--t-16); font-weight: 600; margin: 0; }
h3 { font-size: var(--t-14); font-weight: 600; margin: 0 0 var(--e-2); }
p { margin: 0 0 var(--e-3); }
.cartao { background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--r-3); min-width: 0; }
.cartao > .cab { display: flex; align-items: center; gap: var(--e-3); flex-wrap: wrap; padding: var(--e-4) var(--e-4) var(--e-3); }
.cartao > .cab h2 { flex: 1 1 auto; min-width: 0; }
.cartao > .corpo { padding: 0 var(--e-4) var(--e-4); }
.cartao > .lista:last-child > li:last-child .linha { border-radius: 0 0 var(--r-3) var(--r-3); }
.pilha { display: grid; gap: var(--e-4); grid-template-columns: minmax(0, 1fr); }
.grade-2 { display: grid; gap: var(--e-4); grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .grade-2 { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); } .grade-2.iguais { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--e-3); }
@media (min-width: 768px) { .kpis { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); } }
.kpi { padding: var(--e-3) var(--e-4); }
.kpi .rot { font-size: var(--t-13); color: var(--texto-3); font-weight: 600; }
.kpi .val { font-size: var(--t-numero); font-weight: 600; line-height: var(--l-numero); margin-top: var(--e-1); overflow-wrap: anywhere; }
.kpi .var { font-size: var(--t-12); font-weight: 600; margin-top: 2px; color: var(--texto-3); }
.ficha .kpi .val { font-size: var(--t-20); }
/* etiquetas */
.etq { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 0 10px; border-radius: var(--r-cheio); font-size: var(--t-12); font-weight: 600; white-space: nowrap; background: var(--superficie-3); color: var(--texto-2); }
.etq::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.etq.sp::before { display: none; }
@media (max-width: 359px) { .etq { white-space: normal; } }   /* letra maior do Android: a etiqueta longa quebra em vez de empurrar a tela */
.etq.ok { background: var(--ok-fundo); color: var(--ok-texto); } .etq.atencao { background: var(--atencao-fundo); color: var(--atencao-texto); }
.etq.perigo { background: var(--perigo-fundo); color: var(--perigo-texto); } .etq.info { background: var(--info-fundo); color: var(--info-texto); }
.etqs { display: flex; gap: var(--e-2); flex-wrap: wrap; }
/* botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--e-2); min-height: var(--alvo); padding: 0 var(--e-4); border-radius: var(--r-2); border: 1px solid transparent; font-weight: 600; font-size: var(--t-14); cursor: pointer; text-align: center; }
.btn.pri { background: var(--primaria); color: var(--botao-texto); } .btn.pri:hover { background: var(--primaria-forte); }
.btn.sec { background: var(--superficie); color: var(--texto); border-color: var(--borda-forte); } .btn.sec:hover { background: var(--superficie-2); }
.btn.fant { background: none; color: var(--primaria-texto); padding: 0 var(--e-2); } .btn.fant:hover { background: var(--superficie-3); }
.btn.perigo { background: var(--perigo-forte); color: var(--perigo-botao-texto); } .btn.perigo:hover { background: var(--perigo-texto); }
.btn.perigo-sec { background: var(--superficie); color: var(--perigo-texto); border-color: color-mix(in srgb, var(--perigo-forte) 40%, transparent); }
.btn:disabled { background: var(--superficie-2); color: var(--desativado); border-color: var(--borda); cursor: not-allowed; }
.btn.plena { width: 100%; }
.acoes { display: flex; gap: var(--e-2); flex-wrap: wrap; }
.acoes.mt, .mt { margin-top: var(--e-3); }
/* listas */
.lista { list-style: none; margin: 0; padding: 0; }
.lista > li { border-top: 1px solid var(--borda); }
.lista > li:first-child { border-top: 0; }
.linha { display: flex; align-items: center; flex-wrap: wrap; gap: var(--e-2) var(--e-3); width: 100%; min-height: 60px; padding: var(--e-3) var(--e-4); background: none; border: 0; text-align: left; color: inherit; font: inherit; }
button.linha { cursor: pointer; } button.linha:hover { background: var(--superficie-2); }
.linha[aria-current="true"] { position: relative; background: var(--primaria-suave); }
/* o selecionado: a marca suave com a barra de 3 px na marca (no menu, no trilho e na lista) */
.linha[aria-current="true"]::before, .lateral button.item-nav[aria-current="page"]::before, .trilho button[aria-current="page"]::before {
  content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 2px 2px 0; background: var(--primaria); }
.linha > .cresce { flex: 1 1 11em; min-width: 0; }
.linha .t1 { font-weight: 600; overflow-wrap: anywhere; }
.linha .t2 { font-size: var(--t-13); color: var(--texto-3); overflow-wrap: anywhere; }
.linha .direita { display: flex; align-items: center; gap: var(--e-2); flex: 0 1 auto; flex-wrap: wrap; justify-content: flex-end; }
.linha .direita .mudo { white-space: nowrap; }
.linha.cli .t1, .linha.cli .t2 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar { width: 40px; height: 40px; border-radius: var(--r-cartao); display: grid; place-items: center; font-weight: 600; font-size: var(--t-14); flex: none; background: var(--info-fundo); color: var(--info-texto); }
.avatar.ok { background: var(--ok-fundo); color: var(--ok-texto); } .avatar.atencao { background: var(--atencao-fundo); color: var(--atencao-texto); } .avatar.perigo { background: var(--perigo-fundo); color: var(--perigo-texto); }
.prior { width: 4px; align-self: stretch; min-height: 36px; border-radius: 4px; flex: none; background: var(--info-forte); }
.prior.critico { background: var(--perigo-forte); } .prior.atencao { background: var(--atencao-forte); }
.icone-caixa { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--superficie-3); color: var(--texto-2); }
.uso { height: 6px; border-radius: 6px; background: var(--superficie-3); overflow: hidden; margin-top: 6px; }
.uso > i { display: block; height: 100%; border-radius: 6px; background: var(--primaria); }
.uso.alto > i { background: var(--atencao-forte); } .uso.cheio > i { background: var(--perigo-forte); }
/* pares rótulo / valor */
.dados { display: grid; grid-template-columns: fit-content(45%) minmax(0, 1fr); gap: var(--e-2) var(--e-4); margin: 0; font-size: var(--t-14); }
.dados dt { color: var(--texto-3); } .dados dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
/* campos */
.campo { display: grid; gap: 6px; margin-bottom: var(--e-4); min-width: 0; }
.campo > .rot { font-size: var(--t-14); font-weight: 600; color: var(--texto-2); }
.entrada { width: 100%; min-height: var(--alvo); padding: 10px 12px; border-radius: var(--r-2); border: 1px solid var(--borda-forte); background: var(--superficie); color: var(--texto); }
textarea.entrada { min-height: 88px; resize: vertical; }
.entrada:focus { border-color: var(--primaria); outline: 3px solid var(--foco); outline-offset: 0; }
.entrada.codigo { letter-spacing: .3em; font-size: 22px; text-align: center; font-weight: 600; }
.ajuda { font-size: var(--t-13); color: var(--texto-3); }
.erro { font-size: var(--t-14); color: var(--perigo-texto); font-weight: 600; min-height: 1.4em; margin: 0 0 var(--e-2); }
.form-2 { display: grid; gap: 0 var(--e-4); grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1024px) { .form-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .form-2 .largo { grid-column: 1 / -1; } }
/* toggle */
.toggle { position: relative; width: 52px; height: 32px; flex: none; border-radius: var(--r-cheio); border: 0; background: var(--toggle-off); cursor: pointer; padding: 0; margin: 6px 0; }
.toggle::before { content: ''; position: absolute; inset: -6px -4px; } /* área de toque de 60×44 em volta do desenho */
.toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF; transition: transform var(--mov); }
.toggle[aria-checked="true"] { background: var(--primaria); } .toggle[aria-checked="true"]::after { transform: translateX(20px); }
.toggle:disabled { opacity: .45; cursor: not-allowed; }
/* abas */
.abas { display: flex; gap: var(--e-1); border-bottom: 1px solid var(--borda); overflow-x: auto; scrollbar-width: none; margin: var(--e-3) calc(-1 * var(--e-4)) 0; padding: 0 var(--e-4); }
.abas::-webkit-scrollbar { display: none; }
.abas button { flex: none; min-height: var(--alvo); padding: 0 var(--e-3); border: 0; background: none; color: var(--texto-3); font-weight: 600; font-size: var(--t-14); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; }
.abas button[aria-selected="true"] { color: var(--texto); border-bottom-color: var(--primaria); }
.filtros { display: flex; gap: var(--e-2); overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.filtros::-webkit-scrollbar { display: none; }
.filtros button { flex: none; min-height: var(--alvo); padding: 0 var(--e-3); border-radius: var(--r-cheio); border: 1px solid var(--borda-forte); background: var(--superficie); color: var(--texto-2); font-size: var(--t-13); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.filtros button[aria-pressed="true"] { background: var(--primaria-suave); border-color: var(--primaria); color: var(--texto); }
.filtros .n { opacity: .75; font-variant-numeric: tabular-nums; }
/* avisos (faixas) */
.aviso { display: flex; gap: var(--e-3); align-items: flex-start; padding: var(--e-3) var(--e-4); border-radius: var(--r-2); font-size: var(--t-14); }
.aviso > div { flex: 1; min-width: 0; }
.aviso.atencao { background: var(--atencao-fundo); color: var(--atencao-texto); } .aviso.perigo { background: var(--perigo-fundo); color: var(--perigo-texto); }
.aviso.info { background: var(--info-fundo); color: var(--info-texto); } .aviso.ok { background: var(--ok-fundo); color: var(--ok-texto); }
.aviso b { font-weight: 600; }
/* gráfico de barras (desenhado aqui) */
.grafico { display: flex; align-items: flex-end; gap: 2px; height: 96px; padding-top: var(--e-2); border-bottom: 1px solid var(--borda); }
.grafico i { flex: 1; min-width: 2px; border-radius: 3px 3px 0 0; background: var(--primaria); }
@media (max-width: 479px) { .grafico { gap: 1px; } }   /* 90 barras de 2 px cabem em 360 px */
@media (max-width: 359px) { .grafico i { min-width: 1px; } }   /* e de 1 px com a letra maior do Android (130% = 277 px) */
.eixo { display: flex; justify-content: space-between; font-size: var(--t-11); color: var(--texto-3); margin-top: 4px; }
/* lista + detalhe (≥1024) */
.mestre-detalhe { display: grid; gap: var(--e-4); grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1024px) {
  .mestre-detalhe { grid-template-columns: minmax(300px, 370px) minmax(0, 1fr); align-items: start; }
  .mestre-detalhe > .mestre { position: sticky; top: calc(var(--topo-h) + var(--e-6)); max-height: calc(100vh - var(--topo-h) - 48px); overflow: auto; }
}
.vazio { text-align: center; padding: var(--e-8) var(--e-4); color: var(--texto-3); }
.vazio .icone-caixa { margin: 0 auto var(--e-3); width: 48px; height: 48px; border-radius: 14px; }
/* ficha */
.ficha-cab { display: flex; gap: var(--e-3) var(--e-4); align-items: center; flex-wrap: wrap; }
.ficha-cab .avatar { width: 52px; height: 52px; border-radius: 16px; font-size: var(--t-18); }
.ficha-cab .texto { flex: 1 1 220px; min-width: 0; }
.ficha-cab .nome-ficha { font-size: var(--t-24); line-height: var(--l-titulo); font-weight: 600; margin: 0 0 var(--e-2); overflow-wrap: anywhere; }
.passos { display: grid; gap: var(--e-3); }
.passo { display: flex; gap: var(--e-3); align-items: flex-start; }
.passo .bola { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--ok-fundo); color: var(--ok-texto); }
.passo.agora .bola { background: var(--atencao-fundo); color: var(--atencao-texto); } .passo.depois .bola { background: var(--superficie-3); color: var(--texto-3); }
details.grupo { border-top: 1px solid var(--borda); }
details.grupo:first-of-type { border-top: 0; }
details.grupo > summary { cursor: pointer; font-weight: 600; padding: var(--e-3) var(--e-4); min-height: var(--alvo); display: flex; align-items: center; gap: var(--e-2); list-style: none; }
details.grupo > summary::-webkit-details-marker { display: none; }
details.grupo > summary::before { content: '›'; font-size: 20px; line-height: 1; transition: transform var(--mov); color: var(--texto-3); }
details.grupo[open] > summary::before { transform: rotate(90deg); }
details.grupo > .corpo-grupo { padding: 0 var(--e-4) var(--e-4); }
.segredo { font: 600 18px/1.5 ui-monospace, Menlo, monospace; letter-spacing: .06em; background: var(--superficie-2); border: 1px dashed var(--borda-forte); border-radius: var(--r-2); padding: var(--e-3); text-align: center; overflow-wrap: anywhere; user-select: all; -webkit-user-select: all; }
.tabela-rolagem { overflow-x: auto; }
table.dados-t { border-collapse: collapse; font-size: var(--t-14); min-width: 100%; }
table.dados-t th, table.dados-t td { border-bottom: 1px solid var(--borda); padding: var(--e-2) var(--e-3); text-align: left; white-space: nowrap; }
table.dados-t thead th { font-size: var(--t-12); color: var(--texto-3); font-weight: 500; }
/* janela (iPad e computador) e folha que sobe de baixo (celular) */
.veu { position: fixed; inset: 0; z-index: 70; background: var(--veu); display: grid; place-items: center; grid-template-columns: minmax(0, 1fr); padding: var(--e-4); }
.janela { width: min(540px, 100%); justify-self: center; max-height: min(88vh, 780px); overflow: auto; background: var(--superficie); border-radius: var(--r-4); box-shadow: var(--sombra-janela); min-width: 0; }
.janela > .cab { display: flex; align-items: flex-start; gap: var(--e-3); padding: var(--e-5) var(--e-5) var(--e-2); }
.janela > .cab .texto { flex: 1; min-width: 0; }
.janela > .cab h2 { font-size: var(--t-18); overflow-wrap: anywhere; }
.janela .icone-risco { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--info-fundo); color: var(--info-texto); }
.janela .icone-risco.n3 { background: var(--perigo-fundo); color: var(--perigo-texto); }
.janela > .corpo { padding: var(--e-2) var(--e-5) var(--e-2); }
.janela > .pe { display: flex; gap: var(--e-2); justify-content: flex-end; flex-wrap: wrap; padding: var(--e-4) var(--e-5) var(--e-5); border-top: 1px solid var(--borda); position: sticky; bottom: 0; background: var(--superficie); }
.alca { display: none; }
@media (max-width: 767px) {
  .veu { place-items: end stretch; padding: 0; }
  .janela { width: 100%; max-height: 92vh; border-radius: var(--r-4) var(--r-4) 0 0; }
  .janela > .pe { flex-direction: column-reverse; padding-bottom: calc(var(--e-5) + env(safe-area-inset-bottom, 0px)); } .janela > .pe .btn { width: 100%; }
  .alca { display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--borda-forte); margin: var(--e-2) auto 0; }
}
.nivel { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-12); font-weight: 600; border-radius: var(--r-cheio); padding: 2px 10px; margin-bottom: 4px; background: var(--info-fundo); color: var(--info-texto); }
.nivel.n3 { background: var(--perigo-fundo); color: var(--perigo-texto); }
table.ad { width: 100%; border-collapse: collapse; font-size: var(--t-14); margin: var(--e-2) 0 var(--e-4); }
table.ad th, table.ad td { text-align: left; padding: var(--e-2); border-bottom: 1px solid var(--borda); vertical-align: top; overflow-wrap: anywhere; }
table.ad thead th { font-size: var(--t-12); color: var(--texto-3); font-weight: 500; }
table.ad td.depois { font-weight: 600; color: var(--texto); }
/* menu de ações (folha) */
.menu-acoes { list-style: none; margin: 0; padding: 0 0 var(--e-2); }
.menu-acoes button { width: 100%; display: flex; align-items: center; gap: var(--e-3); min-height: 52px; padding: var(--e-2) var(--e-5); border: 0; background: none; text-align: left; cursor: pointer; font-weight: 600; color: var(--texto); }
.menu-acoes button:hover { background: var(--superficie-2); }
.menu-acoes button.perigoso { color: var(--perigo-texto); }
.menu-acoes .t2 { display: block; font-weight: 400; font-size: var(--t-13); color: var(--texto-3); }
/* mensagem rápida */
.rapida { position: fixed; z-index: 80; left: calc(env(safe-area-inset-left, 0px) + var(--e-4)); right: calc(env(safe-area-inset-right, 0px) + var(--e-4)); bottom: calc(var(--barra-h) + var(--e-3) + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: var(--e-3); min-height: 52px; padding: var(--e-2) var(--e-2) var(--e-2) var(--e-4); background: var(--rapida-fundo); color: var(--superficie); border-radius: var(--r-3); box-shadow: var(--sombra-menu); font-size: var(--t-14); font-weight: 600; }
.rapida > span { flex: 1; min-width: 0; }
.rapida button { min-height: var(--alvo); min-width: var(--alvo); padding: 0 var(--e-3); border-radius: var(--r-2); border: 0; background: transparent; color: var(--rapida-acao); font-weight: 600; cursor: pointer; }
@media (min-width: 768px) { .rapida { left: auto; right: var(--e-6); bottom: var(--e-6); max-width: 440px; } }
/* esqueleto */
.esq { display: block; height: 16px; margin: 14px 0; border-radius: var(--r-botao); background: var(--superficie-3); }
.esq.l2 { width: 80%; } .esq.l3 { width: 55%; }
/* busca */
.paleta { width: min(640px, 100%); justify-self: center; align-self: start; margin-top: 10vh; background: var(--superficie); border-radius: var(--r-4); box-shadow: var(--sombra-janela); overflow: hidden; }
.paleta .busca { display: flex; align-items: center; gap: var(--e-2); padding: 0 var(--e-3) 0 var(--e-4); border-bottom: 1px solid var(--borda); }
.paleta .busca input { flex: 1; min-width: 0; height: 56px; border: 0; background: none; outline: none; font-size: var(--t-18); }
.paleta .resultados { max-height: 60vh; overflow: auto; padding-bottom: var(--e-2); }
.paleta .linha[aria-selected="true"] { background: var(--primaria-suave); }
@media (max-width: 767px) { .veu.cheia { padding: 0; place-items: stretch; } .paleta { margin-top: 0; border-radius: 0; height: 100%; width: 100%; padding-top: env(safe-area-inset-top, 0px); } .paleta .resultados { max-height: none; } }
.menu-grupo { font-size: var(--t-12); font-weight: 500; color: var(--texto-3); margin: var(--e-5) var(--e-1) var(--e-2); }
/* entrada (login) */
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
/* ficha ao lado da lista (iPad deitado e computador): nome menor e abas mais juntas, para caber as 5 */
.mestre-detalhe .ficha-cab .nome-ficha { font-size: var(--t-20); }
.mestre-detalhe .abas button { padding: 0 var(--e-2); }

/* #225: a central de avisos, as notificações e o "Instalar" (DEC-179 e DEC-181; o app autenticador saiu, DEC-186) */
.aviso-linha { align-items: flex-start; }
.aviso-texto { margin: var(--e-2) 0 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--texto); }
.nao-lido .t1 { font-weight: 600; }
.ponto-novo { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--primaria); margin-right: var(--e-2); vertical-align: middle; }
.pilha-peq { display: flex; flex-direction: column; gap: var(--e-1); align-items: flex-end; }
.linha-filtros { display: flex; flex-wrap: wrap; gap: var(--e-3); align-items: center; }
.linha-filtros .entrada { flex: 1 1 220px; }
.chk { display: inline-flex; align-items: center; gap: var(--e-2); min-height: var(--alvo); }

  // que fez no painel da clínica, com o IP e o e-mail (o dono vê o mesmo em Conta › Acessos recentes, sem o IP). Só com a ficha completa ligada.

}

    if (!x.ativo && !parada) item('Retomar o atendimento', 'A assistente volta a atender.', () => fazer('situacao_retomar', { cliente_id: x.cliente_id }, { titulo: 'Retomar a assistente de ' + x.nome, linhas: [['Assistente', 'pausada', 'atendendo']], ok: 'Retomada.' }));
    if (!parada) item('Suspender', 'Nível 3. Equipe: só volta pela Central. Inadimplência: volta ao pagar.', () => fazer('situacao_suspender', { cliente_id: x.cliente_id }, { titulo: 'Suspender ' + x.nome, nome: x.nome, botao: 'Suspender a clínica', ok: 'Suspensa.',

    // rxsync-sistema DEC-206 (sql/093): congelar (90 dias, renovável), renovar e reativar.
    if (st === 'Congelado') {
      item('Reativar', 'Nível 3. Volta ao normal com uma assinatura nova no Asaas; a clínica conecta o WhatsApp pelo painel.', () => fazer('cliente_descongelar', { cliente_id: x.cliente_id }, {
        titulo: 'Reativar ' + x.nome, nome: x.nome, botao: 'Reativar', ok: 'Reativada.',
        texto: 'A clínica volta ao que era e a cobrança recomeça com uma assinatura nova no Asaas (em até 15 minutos), no vencimento abaixo. O sugerido é o vencimento que ela tinha mais os dias congelados. A clínica recebe um e-mail com o passo para conectar o WhatsApp.',

          { k: 'motivo', rot: 'Motivo (fica no registro)', longo: true }] }));
      item('Renovar o congelamento', 'Nível 2. Mais 90 dias, sem cobrança.', () => fazer('cliente_congelar_renovar', { cliente_id: x.cliente_id }, {
        titulo: 'Renovar o congelamento de ' + x.nome, ok: 'Congelamento renovado.',
        linhas: [['Congelada até', x.congelado ? fmtData(x.congelado.ate) : '—', '90 dias depois']],
        campos: [{ k: 'combinado', rot: 'Como foi combinado com a clínica', ph: 'Ex.: e-mail de 10/11' }] }));
    }

      titulo: 'Congelar ' + x.nome, nome: x.nome, botao: 'Congelar a clínica', ok: 'Congelada.',
      texto: 'A assinatura do Asaas é cancelada (em até 15 minutos), o painel fecha, a assistente e as rotinas param e o WhatsApp é desconectado agora. A agenda, os pacientes, as conversas e a configuração ficam guardados. Vale 90 dias, renovável; a Central avisa 7 dias antes. A clínica recebe um e-mail.',

    if (x.cancelar_em) item('Desfazer o cancelamento', 'A clínica recebe um e-mail.', () => fazer('cancelamento_desfazer', { cliente_id: x.cliente_id }, { titulo: 'Desfazer o cancelamento de ' + x.nome, linhas: [['Cancelamento', fmtData(x.cancelar_em), '(nenhum)']], ok: 'Cancelamento desfeito.' }));

    item('Encerrar todos os acessos', 'Nível 3. Quem está no painel sai e os aparelhos lembrados não valem mais.', () => fazer('link_painel_novo', { cliente_id: x.cliente_id }, { titulo: 'Encerrar todos os acessos ao painel', nome: x.nome, botao: 'Encerrar os acessos',

  }
  // Histórico das conversas a pedido da clínica (sql/059, DEC-131, #67; cláusula 19.2): o 31 monta o CSV e manda direto
  // ao e-mail do cadastro. O arquivo não passa pela Central. Nível 2.
  // rxsync-sistema DEC-206 (sql/093): junto com as conversas, a agenda e os pacientes (cláusula 19.2); vale também congelada.
  if (!['Dados apagados', 'Excluir agora'].includes(st)) item('Enviar os dados ao e-mail do cadastro', 'Nível 2. Conversas, agenda e pacientes, só a pedido da clínica; os arquivos não passam pela Central.', () => fazer('conversas_enviar', { cliente_id: x.cliente_id }, {

  if (ligada('editar_onboarding') && x.pode_reenviar_onboarding) item('Reenviar o onboarding', 'O workflow 21 manda o link novo em até 10 minutos.', () => fazer('reenviar_onboarding', { cliente_id: x.cliente_id }, { titulo: 'Reenviar o onboarding de ' + x.nome, linhas: [['Link atual', 'vale', 'deixa de valer']] }));
  if (est.chaves.asaas_ambiente === 'sandbox' && !x.interna) {
    if (ehTesteCobranca(x)) item('Deixar de ser a clínica de teste da cobrança', 'As edições de dinheiro voltam a depender das chaves.', async () => {
      const r = await fazer('cobranca_teste_definir', { cliente_id: '' }, { titulo: 'Limpar a clínica de teste da cobrança', linhas: [['Clínica de teste', x.cliente_id, '(nenhuma)']], ok: 'Clínica de teste limpa.', depois: async () => { await carregarConfig(); await rotear(); } });
      return r;

    // rxsync-sistema DEC-205 (sql/093): a clínica de verdade sai na hora só se ela pediu e abriu mão dos 15 dias (cláusula
    // 19.2); sem o pedido, encerra hoje (a assistente para e o WhatsApp desconecta agora) e os dados saem em 15 dias.
    else if (st !== 'Cancelado') item('Excluir a clínica', 'Nível 3. A pedido dela, apaga agora; sem o pedido, encerra hoje e os dados saem em 15 dias.', () => fazer('cliente_excluir', { cliente_id: x.cliente_id }, {

// Um título por dia (Hoje, Ontem, quarta-feira, 29/10), o mais novo no alto.
function avisosPorDia(lista, linha) {
  const chave = v => { const d = new Date(String(v).replace(' ', 'T')); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return isNaN(d) ? '' : d.toISOString().slice(0, 10); };
  const hoje = hojeISO(), ontem = somaDias(hoje, -1), grupos = [];
  for (const a of lista) { const k = chave(a.recebido_em); if (!grupos.length || grupos[grupos.length - 1][0] !== k) grupos.push([k, []]); grupos[grupos.length - 1][1].push(a); }
  const nome = k => k === hoje ? 'Hoje' : k === ontem ? 'Ontem' : k ? new Date(k + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit' }) : 'Sem data';
  return grupos.map(([k, itens]) => [el('h3', { class: 'aviso-dia', text: nome(k) }), el('ul', { class: 'lista' }, itens.map(linha))]);
}

  let conteudo, ler = () => true;

function rotulosPrompt(versoes, porPrompt) {

    return v || (versoes.length ? Math.min(...versoes.map(x => x.versao)) : 0); };
  return (p, i) => { const v = versaoDe(p), repetida = porPrompt.some((q, k) => k !== i && versaoDe(q) === v);
    return (v ? 'Versão ' + v : 'Versão sem número') + (repetida ? ' · regras fixas de ' + fmtData(p.desde) : ''); };
}

// com Agora × Depois; 3 = também o nome. Se o servidor pedir mais, pergunta de novo uma vez, como o fazer.

// ---------------------------------------------------------------- Análise › Métricas (DEC-146)
// Preço da OpenAI por mil tokens (entrada e saída), para o custo de IA em reais. Grava pela mesma ação de antes da página
// Custos da Prospecção (prosp_custos_salvar), só com os 2 preços (rxsync-sistema DEC-211).
const precoReais = v => String(v || '').trim().replace(/\./g, '').replace(',', '.');
function precoOpenAI() {
  return fazer('prosp_custos_salvar', {}, { titulo: 'Preço da OpenAI', texto: 'Por mil tokens, em reais (ex.: 0,0015). Vale para o custo de IA da Central e da prospecção.',
    campos: [{ k: 'entrada', rot: 'Mil tokens de entrada (R$)', inputmode: 'decimal', obrig: true, erro: 'Digite o preço (ex.: 0,0015).' },
      { k: 'saida', rot: 'Mil tokens de saída (R$)', inputmode: 'decimal', obrig: true, erro: 'Digite o preço (ex.: 0,006).' }],
    preparar: v => { const { entrada, saida, ...resto } = v;
      return { ...resto, itens: [{ tipo: 'preco_mil_tokens_entrada', valor: precoReais(entrada), descricao: '' }, { tipo: 'preco_mil_tokens_saida', valor: precoReais(saida), descricao: '' }] }; },
    ok: 'Preço salvo.' });
}
TELAS.metricas = async c => {

  trocar(c, cabecalho('Métricas', 'os números do mês, sem a clínica interna'), el('div', { class: 'pilha' },
    el('div', { class: 'kpis' }, kpi('MRR', fmtReal(m.total), 'receita recorrente do mês'), kpi('Pagantes no ar', fmtNum(d.pagantes_no_ar)),
      kpi('Ticket médio', d.ticket_medio == null ? '—' : fmtReal(d.ticket_medio), 'MRR ÷ pagantes'), kpi('Cancelamentos do mês', fmtNum(can.clinicas), fmtReal(can.receita_perdida) + ' perdidos')),
    el('div', { class: 'grade-2 iguais' },

      cartao('Teste grátis e go-live (90 dias)', null, corpo(dados([['Testes começados', fmtNum(conv.testes)], ['Viraram contrato', fmtNum(conv.viraram_contrato)],
        ['Conversão', conv.percentual == null ? '—' : String(conv.percentual).replace('.', ',') + '%'], ['Dias até o go-live (média)', d.dias_ate_go_live_90d == null ? '—' : String(d.dias_ate_go_live_90d).replace('.', ',')]]),

      el('div', { class: 'grade-2 iguais' },

          ['Prospecção', tok(ci.prospeccao) + (ci.preco_preenchido ? ' · ' + fmtReal((ci.prospeccao || {}).reais) : '')], ['Total do mês', ci.preco_preenchido ? fmtReal(ci.total_reais) : '—']]),
        el('div', { class: 'cartao kpi ia-mensagens' }, el('div', { class: 'rot', text: 'Mensagens do atendimento no mês' }), el('div', { class: 'val num', text: fmtNum(ci.mensagens_atendimento_mes) }),
          el('div', { class: 'var', text: 'todas as clínicas; fora do custo acima' }))),

      // O preço da OpenAI (rxsync-sistema DEC-211: a página Custos da Prospecção saiu): uma folha só com os 2 preços.
      ci.preco_preenchido ? null : el('div', { class: 'aviso atencao mt' }, icone('alerta'), el('div', {}, 'Para ver o custo em reais, preencha o preço por mil tokens (entrada e saída).')),
      ligada('editar_prospeccao') ? el('div', { class: 'acoes mt' }, btn(ci.preco_preenchido ? 'Mudar o preço' : 'Preencher o preço', precoOpenAI, 'sec')) : null)),
    cartao('Uso do assistente no mês', null, corpo(dados([['Perguntas', fmtNum(uso.perguntas)], ['Propostas', fmtNum(uso.propostas)], ['Confirmadas', fmtNum(uso.confirmadas)]])))));

// ==== 11_app.js
// ---------------------------------------------------------------- notificações e instalar (#225, DEC-181)
// O app autenticador saiu (DEC-186): o código de entrada chega no e-mail de cadastro. As notificações chegam sem
// conteúdo: o service worker (central/sw.js) pergunta só os números (push_resumo) e mostra "Alertas: 1 aviso novo".
const ehInstalado = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const ehIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const B64 = s => { const p = '='.repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, ch => ch.charCodeAt(0)); };
const chaveAleatoria = () => { const a = new Uint8Array(32); crypto.getRandomValues(a); return btoa(String.fromCharCode(...a)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
// A chave da inscrição fica no próprio aparelho (IndexedDB), para o service worker perguntar o que há de novo.
function guardarInscricao(dados) {
  return new Promise(ok => { try { const q = indexedDB.open('rxsync-central', 1); q.onupgradeneeded = () => q.result.createObjectStore('push');
    q.onsuccess = () => { const tx = q.result.transaction('push', 'readwrite'); dados ? tx.objectStore('push').put(dados, 'inscricao') : tx.objectStore('push').delete('inscricao'); tx.oncomplete = () => ok(true); tx.onerror = () => ok(false); };
    q.onerror = () => ok(false); } catch (e) { ok(false); } });
}
function passosInstalar(onde) {
  return el('ol', { class: 'passos-instalar' },
    el('li', { text: 'Abra ' + onde + ' no Safari.' }),
    el('li', { text: 'Toque no botão Compartilhar (o quadrado com a seta para cima, no alto da tela).' }),
    el('li', { text: 'Role e toque em "Adicionar à Tela de Início".' }),
    el('li', { text: 'Toque em "Adicionar".' }),
    el('li', { text: 'Feche o Safari e abra pelo ícone novo da Tela de Início.' }),
    el('li', { text: 'Dentro do app, toque em "Ativar notificações" e depois em "Permitir".' }));
}
// Hoje: o cartão "Instale a Central", só no navegador (no app instalado, não aparece), no fim de Hoje, depois do que precisa
// de atenção (auditoria de 01/11/2026, FD-26). "Agora não" vale 30 dias neste aparelho (FD-02).
const instalarAdiado = () => { if (est.instalarDepois) return true; try { return Date.now() - Number(localStorage.getItem('central_instalar_depois') || 0) < 30 * 86400000; } catch (e) { return false; } };
function cartaoInstalar() {
  if (ehInstalado() || instalarAdiado()) return null;
  const box = cartao('Instale a Central', null, corpo(el('p', { class: 'mudo', text: 'Instalada, ela abre como um app e pode mandar notificações dos avisos.' }),
    ehIOS() ? passosInstalar('a Central') : el('p', { class: 'mudo', text: 'No Chrome, use o menu do navegador e "Instalar app".' }),
    el('div', { class: 'acoes' }, btn('Agora não', () => { est.instalarDepois = true; try { localStorage.setItem('central_instalar_depois', String(Date.now())); } catch (e) {} box.remove(); }, 'fant'))));
  return box;
}
// Segurança: notificações neste aparelho (só no app instalado; no iPad, iPadOS 16.4 ou mais novo) e o "Mandar alerta de
// teste" (antes no fim de Avisos, onde ninguém achava: auditoria de 01/11/2026, FD-23). O teste vale também sem o app: o
// e-mail dos urgentes chega do mesmo jeito.
const alertaTeste = () => btn('Mandar alerta de teste', async () => { const x = await chamar('aviso_teste'); rapida(x.mensagem || (x.ok ? 'Alerta de teste enviado.' : 'Não consegui.')); }, 'sec');
async function cartaoNotificacoes() {
  const cx = corpo();
  const pronto = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  if (!ehInstalado() || !pronto) {
    trocar(cx, el('p', { class: 'mudo', text: 'As notificações só funcionam com a Central instalada (no iPad, iPadOS 16.4 ou mais novo). Para instalar:' }), passosInstalar('a Central'),
      el('p', { class: 'mudo', text: '"Mandar alerta de teste" manda um alerta para Avisos, para o e-mail de cadastro e, com a Central instalada, como notificação.' }), el('div', { class: 'acoes' }, alertaTeste()));
    return cartao('Notificações neste aparelho', null, cx);
  }
  const reg = await navigator.serviceWorker.register('/central/sw.js', { scope: '/central/' });
  const sub = await reg.pushManager.getSubscription();
  const k = await chamar('push_chave', { endpoint: sub ? sub.endpoint : '' });
  const marcados = new Set(k.assuntos && k.assuntos.length ? k.assuntos : ['alertas', 'falhas', 'clientes', 'financeiro', 'vendas', 'suporte']);
  const caixas = el('div', { class: 'filtros opcoes-assuntos', role: 'group', 'aria-label': 'Assuntos que notificam' }, CATEGORIAS.map(a => el('button', { type: 'button', 'data-assunto': a,
    'aria-pressed': String(marcados.has(a)), onclick: e => e.currentTarget.setAttribute('aria-pressed', String(e.currentTarget.getAttribute('aria-pressed') !== 'true')) }, NOME_ASSUNTO[a] || a)));
  const assuntos = () => [...caixas.querySelectorAll('[aria-pressed="true"]')].map(b => b.dataset.assunto);
  const ligar = async () => {
    if (!k.ok) { rapida(k.mensagem || 'As notificações ainda não estão prontas. Tente de novo em 1 hora.'); return; }
    const p = await Notification.requestPermission(); if (p !== 'granted') { rapida('Sem permissão. No iPad: Ajustes › Notificações › Central RXSync.'); return; }
    const s = sub || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: B64(k.publica) });
    const chave = chaveAleatoria();
    const x = await chamar('push_inscrever', { endpoint: s.endpoint, chave, assuntos: assuntos() });
    if (x.ok) await guardarInscricao({ endpoint: s.endpoint, chave });
    rapida(x.mensagem || (x.ok ? 'Notificações ligadas.' : 'Não consegui.')); rotear();
  };
  trocar(cx, el('p', { class: 'mudo', text: k.inscrito ? 'Ligadas neste aparelho. Escolha os assuntos e toque em "Salvar".' : 'Escolha os assuntos e toque em "Ativar notificações". O iPad pede a permissão uma vez.' }), caixas,
    el('div', { class: 'acoes' }, btn(k.inscrito ? 'Salvar' : 'Ativar notificações', ligar, 'pri'), alertaTeste(),
      k.inscrito ? btn('Desligar neste aparelho', async () => { const x = await chamar('push_sair', { endpoint: sub ? sub.endpoint : '' }); if (sub) await sub.unsubscribe(); await guardarInscricao(null); rapida(x.mensagem || 'Desligadas.'); rotear(); }, 'perigo-sec') : null));
  return cartao('Notificações neste aparelho', null, cx);
}
