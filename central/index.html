    blocos.push(bloco('Teste grátis', campos([['Fim do teste', fmtData(x.fim_teste)], comp && ['Dias já estendidos', usados + ' de 30']]), el('div', { class: 'acoes' },
      btnAcao('Estender o teste', async () => {
        const v = await pedir({ titulo: 'Estender o teste de ' + x.nome, aviso: 'Até 30 dias a mais no total por clínica. Se o teste já acabou, a assistente volta a atender.',
          campos: [{ k: 'dias', rot: 'Quantos dias a mais', inputmode: 'numeric', obrig: true, valor: '7' }, { k: 'motivo', rot: 'Motivo', longo: true, obrig: true, minimo: 5, erro: 'Escreva o motivo (5 letras ou mais).' }, { k: 'combinado', rot: 'Combinado com a clínica (se houver)', longo: true }] });
        if (v) fazer('teste_estender', { cliente_id: x.cliente_id, ...v });
      }))));
  }

  // Recursos do plano e liberações (DEC-063).
  if (comp) {
    const rec = comp.recursos || {}, libs = comp.liberacoes || [], essencial = /^essencial/i.test(String(x.plano || '').trim());
    const linhas = Object.keys(RECURSOS_NOMES).map(k => el('li', {}, el('div', { class: 'cresce titulo-item', text: RECURSOS_NOMES[k] }),
      el('span', { class: 'pill ' + (rec[k] ? 'ok' : ''), text: rec[k] ? (essencial && (rec.liberados || []).includes(k) ? 'liberado' : 'pelo plano') : 'não' })));
    const vigor = libs.filter(l => l.em_vigor);
    const acoes = [];
    if (ligada('liberar_recursos') && essencial) acoes.push(btnAcao('Liberar um recurso', async () => {
      const ops = (comp.liberaveis || []).filter(k => !rec[k]).map(k => [k, RECURSOS_NOMES[k] || k]);
      if (!ops.length) { toast('Todos os recursos já estão liberados.'); return; }
      const v = await pedir({ titulo: 'Liberar recurso para ' + x.nome, aviso: 'Os recursos do Enterprise (API, avisos de eventos, envio de mensagens) não se liberam: troque o plano. O botão do recurso continua valendo.',
        campos: [{ k: 'recurso', rot: 'Recurso', opcoes: ops }, { k: 'ate', rot: 'Até (deixe vazio para sem data de fim)', tipo: 'date', min: somaDias(hojeISO(), 1) }, { k: 'motivo', rot: 'Motivo', longo: true, obrig: true, minimo: 5, erro: 'Escreva o motivo (5 letras ou mais).' }] });
      if (v) fazer('recurso_liberar', { cliente_id: x.cliente_id, ...v });
    }, 'pri'));
    blocos.push(bloco('Recursos', el('ul', { class: 'lista' }, linhas),
      vigor.length ? el('div', { class: 'mt' }, el('h2', { text: 'Liberações em vigor' }), el('ul', { class: 'lista' }, vigor.map(l => el('li', {}, el('div', { class: 'cresce' },
        el('div', { class: 'titulo-item', text: RECURSOS_NOMES[l.recurso] || l.recurso }), el('div', { class: 'mudo peq', text: 'desde ' + fmtData(l.liberado_em) + (l.ate ? ' · até ' + fmtData(l.ate) : ' · sem data de fim') + ' · ' + (l.motivo || '') })),
        ligada('liberar_recursos') ? btnAcao('Revogar', async () => {
          const v = await pedir({ titulo: 'Revogar ' + (RECURSOS_NOMES[l.recurso] || l.recurso), campos: [{ k: 'motivo', rot: 'Motivo', longo: true, obrig: true, minimo: 5, erro: 'Escreva o motivo (5 letras ou mais).' }] });
          if (v) fazer('recurso_revogar', { cliente_id: x.cliente_id, id: l.id, motivo: v.motivo }, 'Liberação revogada.');
        }, 'perigo') : null)))) : null,
      el('p', { class: 'mudo peq', text: 'Informações extras: até ' + fmtNum(rec.info_extra) + ' letras.' }), el('div', { class: 'acoes' }, acoes)));
  }

  // Edições do cadastro por grupo (as mesmas regras do painel). A empresa fica na tela de dados sensíveis.
  const grupos = [];
  if (comp && ligada('editar_assistente')) grupos.push(formGrupo(x, 'assistente', comp.campos, 'cliente_editar_assistente', 'Assistente (o que o onboarding grava)'));
  if (comp && ligada('editar_configuracoes')) grupos.push(formGrupo(x, 'configuracoes', comp.campos, 'cliente_editar_configuracoes', 'Configurações'));
  if (comp && ligada('editar_recursos')) grupos.push(formGrupo(x, 'recursos', comp.campos, 'cliente_editar_recursos', 'Botões dos recursos'));
  if (ligada('editar_limites')) {
    grupos.push(formGrupo(x, 'limites', comp ? comp.campos : x.limites, 'editar_limites', 'Limites'));
    grupos.push(el('div', { class: 'acoes' }, btnAcao('Registrar o aviso de limitação da franquia', async () => {
      if (await confirmarEdicao('Aviso de limitação da franquia', [], 'Confirme que avisou a clínica (cláusula 11.4). A limitação só pode ser ligada 15 dias depois, se ela seguir acima da franquia.'))
        fazer('franquia_aviso_registrar', { cliente_id: x.cliente_id });
    })));
  }
  if (grupos.length) blocos.push(bloco('Editar o cadastro', ...grupos));

  // Combinados, pedidos ao Asaas e linha do tempo (só leitura).
  if (comp) {
    const comb = comp.combinados || [], peds = comp.pedidos_asaas || [];
    if (comb.length) blocos.push(bloco('Combinados com a clínica', el('ul', { class: 'lista' }, comb.map(k => el('li', {}, el('div', { class: 'cresce' },
      el('div', { class: 'titulo-item', text: k.tipo.replace(/_/g, ' ') + ' · ' + fmtHora(k.criado_em) }), el('div', { class: 'mudo peq', text: 'Motivo: ' + (k.motivo || '—') + (k.combinado ? ' · Combinado: ' + k.combinado : '') })))))));
    if (peds.length) blocos.push(bloco('Pedidos ao Asaas', el('ul', { class: 'lista' }, peds.map(p => el('li', {}, el('div', { class: 'cresce' },
      el('div', { class: 'titulo-item', text: p.tipo.replace(/_/g, ' ') + ' · pedido ' + p.id }), el('div', { class: 'mudo peq', text: fmtHora(p.criado_em) + (p.feito_em ? ' → ' + fmtHora(p.feito_em) : '') + (p.resposta ? ' · ' + p.resposta : '') })),
      el('span', { class: 'pill ' + (p.status === 'feito' ? 'ok' : p.status === 'falhou' ? 'alerta' : 'pend'), text: p.status }))))));
    const lt = comp.linha_do_tempo || [];
    if (lt.length) blocos.push(el('details', { class: 'grupo bloco' }, el('summary', { text: 'Linha do tempo (' + lt.length + ')' }), el('ul', { class: 'lista' }, lt.map(t => {
      const o = String(t.o_que || ''); const txt = o.startsWith('Aviso: ') ? 'Aviso: ' + rotuloTipo(o.slice(7)) : o.startsWith('Central: ') ? 'Central: ' + (NOMES_EVENTO[o.slice(9)] || o.slice(9)) : o;
      return el('li', {}, el('span', { class: 'mudo peq num', text: String(t.quando || '').length > 10 ? fmtHora(String(t.quando).replace(' ', 'T')) : fmtData(t.quando) }), el('span', { class: 'cresce', text: txt }));
    }))));
  }

  // Clínica de teste da cobrança (só no sandbox): pede CONFIRMAR e o nome da clínica; o servidor só aceita clínica nova de teste.
  if (est.chaves.asaas_ambiente === 'sandbox' && !x.interna) {
    blocos.push(bloco('Teste da cobrança (sandbox)', teste
      ? el('div', {}, el('p', { class: 'mudo', text: 'Esta é a clínica de teste da cobrança.' }), btnAcao('Limpar a clínica de teste da cobrança', async () => {
        if (!(await confirmarEdicao('Limpar a clínica de teste da cobrança', [['Clínica de teste', x.cliente_id, '(nenhuma)']]))) return;
        const r = await chamar('cobranca_teste_definir', { cliente_id: '', confirmacao: 'CONFIRMAR' });
        if (!r.ok) { toast(r.mensagem || 'Não consegui.'); return; } await recarregarChaves(); toast('Clínica de teste limpa.'); recarregar();
      }, 'perigo'))
      : el('div', {}, el('p', { class: 'mudo peq', text: 'Só para uma clínica nova de teste, criada por você no contratar.html. O servidor recusa clínica que já pagou ou que é cliente de verdade.' }),
        btnAcao('Usar como clínica de teste da cobrança', async () => {
          const v = await pedir({ titulo: 'Clínica de teste da cobrança', aviso: 'Nela, plano, cobrança e situação mudam mesmo com as chaves desligadas. Chega um aviso no Telegram.', digitar: { rot: 'o nome da clínica', esperado: x.nome } });
          if (!v) return;
          const r = await chamar('cobranca_teste_definir', { cliente_id: x.cliente_id, confirmacao_nome: v._digitado, confirmacao: 'CONFIRMAR' });
          if (!r.ok) { toast(r.mensagem || 'Não consegui.'); return; } await recarregarChaves(); toast('Clínica de teste da cobrança definida.'); recarregar();
        }))));
  }
  return blocos.length ? el('div', { class: 'pilha' }, blocos) : null;
});

// --- Fase 4: tela de dados sensíveis (chave tela_cliente_sensivel). Os dados ficam só nesta tela: não vão para o
// armazenamento do navegador e somem ao sair dela ou quando a Central vai para o fundo (iPad trocou de app).
TELAS.sensivel = async (c, [id]) => {
  const r = await chamar('cliente_sensivel', { cliente_id: id }); if (falhou(c, r)) return;
  const d = r.dados, e = d.empresa || {}, a = d.aceite || {}, cp = d.copia_do_aceite;
  c.replaceChildren(
    el('div', { class: 'acoes' }, btnAcao('‹ Ficha', () => irCliente(d.cliente_id))),
    el('h1', { text: 'Dados sensíveis · ' + d.nome }),
    el('div', { class: 'faixa pend', text: 'Só nesta tela. Ao sair dela, os dados somem da página. Ver esta tela fica no registro.' }),
    bloco('Empresa', campos(GRUPOS.empresa.map(k => [ROTULOS[k] || k, e[k]]))),
    bloco('Registro do aceite (não editável)', campos([['Data do aceite', a.data_aceite], ['Versão dos termos', a.versao_termos], ['IP do aceite', a.ip_aceite], ['Acordo de tratamento (DPA)', a.aceite_dpa]])),
    bloco('Cópia fixa do aceite', cp ? campos([['Guardada em', fmtHora(cp.copiado_em)], ['Razão social', cp.razao_social], ['CNPJ', cp.cnpj], ['Representante', cp.representante_nome],
      ['CPF', cp.representante_cpf], ['E-mail', cp.email], ['Telefone', cp.telefone], ['Data do aceite', cp.data_aceite], ['Versão', cp.versao_termos], ['IP', cp.ip_aceite], ['Plano', cp.plano], ['Valor', cp.valor_mensal]])
      : vazio('Ainda sem cópia: ela é guardada antes da primeira edição dos dados da empresa.')),
    ligada('editar_empresa') ? bloco('Editar os dados da empresa', formGrupo({ cliente_id: d.cliente_id, nome: d.nome }, 'empresa', e, 'cliente_editar_empresa', 'Empresa')) : null);
};
// A Central foi para o fundo: tira os dados sensíveis da tela (volta com "Atualizar").
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && /^#sensivel\//.test(location.hash)) $('conteudo').replaceChildren(el('h1', { text: 'Dados sensíveis' }), el('p', { class: 'mudo', text: 'Escondidos porque a Central saiu da tela. Toque em Atualizar para ver de novo.' }));
});

// --- Fase 4: limites de uma chave da API (Enterprise), em Segurança › Chaves da API
GANCHOS.limitesChave = k => est.chaves.editar_chaves_api === 'SIM' && !k.revogada_em ? btnAcao('Limites', async () => {
  const v = await pedir({ titulo: 'Limites da chave ' + k.prefixo + '…', linhas: [['Por minuto', String(k.limite_minuto), '(a escolher)'], ['Por dia', String(k.limite_dia), '(a escolher)']],
    campos: [{ k: 'limite_minuto', rot: 'Por minuto (1 a 600)', inputmode: 'numeric', valor: String(k.limite_minuto), obrig: true }, { k: 'limite_dia', rot: 'Por dia (1 a 100.000)', inputmode: 'numeric', valor: String(k.limite_dia), obrig: true }] });
  if (v) fazer('chave_api_limites', { id: k.id, limite_minuto: v.limite_minuto.replace(/\D/g, ''), limite_dia: v.limite_dia.replace(/\D/g, '') }, 'Limites mudados.');
}) : null;

// ---------------------------------------------------------------- começo
if (est.sessao) abrirApp(); else entrada();
})();
</script>
