<style>
  body { margin: 0; min-height: 100vh; background: #F7F8F8; color: #15191C; font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  header { background: #FFFFFF; color: #15191C; border-bottom: 1px solid #E3E7E8; padding-top: env(safe-area-inset-top); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
  .topo { display: flex; align-items: center; gap: 10px; height: 56px; font-weight: 600; font-size: 17px; font-family: 'Figtree', 'Inter', sans-serif; }
  .marca { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, #0f172a, #0b5c48 55%, #059669); display: grid; place-items: center; }
  .card { background: #fff; border: 1px solid #E3E7E8; border-radius: 16px; padding: 22px; margin-top: 20px; }
  h1 { margin: 0; font-size: 24px; line-height: 1.3; font-family: 'Figtree', 'Inter', sans-serif; font-weight: 600; }
  p { margin: 10px 0 0; color: #4A545A; }
  .abrir { margin-top: 18px; width: 100%; min-height: 56px; border: 0; border-radius: 12px; background: #0A5148; color: #fff; font: inherit; font-weight: 600; font-size: 17px; cursor: pointer; }
  .abrir:disabled { background: #8A9499; cursor: wait; }
  .abrir:focus-visible, a:focus-visible { outline: 3px solid #0A5148; outline-offset: 2px; }
  .status { margin-top: 10px; font-size: 14px; color: #4A545A; text-align: center; }
  .status.erro { color: #962318; }
  .rodape { margin-top: 16px; font-size: 14px; color: #4A545A; text-align: center; }
  .rodape a { color: #0A5148; font-weight: 600; }
</style>

<body>
  <header><div class="wrap topo"><span class="marca" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></span>RXSync</div></header>

  <main class="wrap">
    <div class="card">
      <h1>Teste da sua assistente</h1>
      <p>Escreva como se fosse um paciente da sua clínica. Nada daqui chega ao WhatsApp de verdade.</p>
      <button type="button" class="abrir" id="abrir" disabled>Carregando o chat...</button>
      <p class="status" id="status" aria-live="polite"></p>
    </div>
    <p class="rodape">Precisa falar com a RXSync? <a href="https://rxsync.com.br/?suporte=1" target="_blank" rel="noopener">Fale com o suporte</a></p>
  </main>

<script>
(function (d, t) {
  var btn = document.getElementById('abrir');
  var status = document.getElementById('status');
  function erro(msg) { btn.textContent = 'Chat indisponível'; status.textContent = msg; status.className = 'status erro'; }

  var token = new URLSearchParams(window.location.search).get('token');
  if (!token) { erro('Link incompleto. Abra o teste de novo pelo painel.'); return; }

  // O botão só funciona depois que o chat terminou de carregar (abrir antes deixa a janela em branco).
  window.addEventListener('chatwoot:ready', function () {
    clearTimeout(demora);
    btn.disabled = false;
    btn.textContent = 'Abrir a conversa';
    status.textContent = '';
  });
  btn.addEventListener('click', function () {
    if (window.$chatwoot) window.$chatwoot.toggle('open');
  });
  var demora = setTimeout(function () {
    erro('O chat não carregou. Recarregue a página. Se continuar, avise o suporte.');
  }, 15000);

  var BASE_URL = 'https://app.rxsync.com.br';
  var g = d.createElement(t), s = d.getElementsByTagName(t)[0];
  g.src = BASE_URL + '/packs/js/sdk.js';
  g.async = true;
  g.onerror = function () { clearTimeout(demora); erro('Não foi possível carregar o chat (app.rxsync.com.br). Confira a internet e recarregue.'); };
  s.parentNode.insertBefore(g, s);
  g.onload = function () {
    try { window.chatwootSDK.run({ websiteToken: token, baseUrl: BASE_URL }); }
    catch (e) { clearTimeout(demora); erro('O chat não iniciou: ' + e.message); }
  };
})(document, 'script');
</script>
</body>
