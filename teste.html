<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Teste da sua assistente | RXSync</title>
<link rel="icon" type="image/png" href="/assets/favicon-rxsync.png.PNG">
<style>
  body { margin: 0; min-height: 100vh; background: #f2f5f4; color: #0f172a; font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  header { background: #0f172a; color: #fff; padding-top: env(safe-area-inset-top); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
  .topo { display: flex; align-items: center; gap: 10px; height: 56px; font-weight: 800; font-size: 17px; }
  .marca { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, #0f172a, #0b5c48 55%, #059669); display: grid; place-items: center; border: 1px solid rgba(255,255,255,.15); }
  .card { background: #fff; border: 1px solid #e0e7e4; border-radius: 16px; padding: 22px; margin-top: 20px; }
  h1 { margin: 0; font-size: 21px; line-height: 1.25; }
  p { margin: 10px 0 0; color: #445263; }
  .abrir { margin-top: 18px; width: 100%; min-height: 56px; border: 0; border-radius: 12px; background: #059669; color: #fff; font: inherit; font-weight: 700; font-size: 17px; cursor: pointer; }
  .abrir:disabled { background: #9fbfb2; cursor: wait; }
  .status { margin-top: 10px; font-size: 14px; color: #66727f; text-align: center; }
  .status.erro { color: #9f1239; }
  .rodape { margin-top: 16px; font-size: 14px; color: #66727f; text-align: center; }
  .rodape a { color: #065f46; font-weight: 700; }
</style>
</head>
<body>
  <header><div class="wrap topo"><span class="marca" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></span>RXSync</div></header>

  <main class="wrap">
    <div class="card">
      <h1>Teste da sua assistente</h1>
      <p>Escreva como se fosse um paciente da sua clínica. Nada daqui chega ao WhatsApp de verdade.</p>
      <button type="button" class="abrir" id="abrir" disabled>Carregando o chat...</button>
      <p class="status" id="status" aria-live="polite"></p>
    </div>
    <p class="rodape">Precisa falar com a RXSync? <a href="https://rxsync.com.br/?suporte=1" target="_blank" rel="noopener">Fale com o suporte</a></p>
  </main>

<script>
(function (d, t) {
  var btn = document.getElementById('abrir');
  var status = document.getElementById('status');
  function erro(msg) { btn.textContent = 'Chat indisponível'; status.textContent = msg; status.className = 'status erro'; }

  var token = new URLSearchParams(window.location.search).get('token');
  if (!token) { erro('Link incompleto. Abra o teste de novo pelo painel.'); return; }

  // O botão só funciona depois que o chat terminou de carregar (abrir antes deixa a janela em branco).
  window.addEventListener('chatwoot:ready', function () {
    clearTimeout(demora);
    btn.disabled = false;
    btn.textContent = 'Abrir a conversa';
    status.textContent = '';
  });
  btn.addEventListener('click', function () {
    if (window.$chatwoot) window.$chatwoot.toggle('open');
  });
  var demora = setTimeout(function () {
    erro('O chat não carregou. Recarregue a página. Se continuar, avise o suporte.');
  }, 15000);

  var BASE_URL = 'https://app.rxsync.com.br';
  var g = d.createElement(t), s = d.getElementsByTagName(t)[0];
  g.src = BASE_URL + '/packs/js/sdk.js';
  g.async = true;
  g.onerror = function () { clearTimeout(demora); erro('Não foi possível carregar o chat (app.rxsync.com.br). Confira a internet e recarregue.'); };
  s.parentNode.insertBefore(g, s);
  g.onload = function () {
    try { window.chatwootSDK.run({ websiteToken: token, baseUrl: BASE_URL }); }
    catch (e) { clearTimeout(demora); erro('O chat não iniciou: ' + e.message); }
  };
})(document, 'script');
</script>
</body>
</html>
